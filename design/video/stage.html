<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bitcode Desktop · video stage</title>
<style>
  :root { --accent: #f7931a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: clip; background: #000; }
  #view { position: relative; width: 1920px; height: 1080px; overflow: clip; background: #050608; }

  /* ---- background: deep gradient, Bitcoin glow, out-of-focus bokeh ---- */
  #bg { position: absolute; inset: 0; background:
      radial-gradient(1400px 820px at 50% 58%, rgba(247, 147, 26, .10), transparent 62%),
      radial-gradient(900px 600px at 12% 8%, rgba(70, 90, 140, .16), transparent 60%),
      radial-gradient(900px 600px at 92% 96%, rgba(247, 147, 26, .09), transparent 60%),
      linear-gradient(180deg, #07090d 0%, #0b0e14 55%, #090a0e 100%); }
  .layer { position: absolute; inset: -200px; will-change: transform; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(7px); background: radial-gradient(circle at 40% 35%, rgba(255, 190, 110, .55), rgba(247, 147, 26, .18) 60%, transparent 72%); }

  /* ---- world: window + cursor, transformed by the camera ---- */
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #winwrap { position: absolute; left: 160px; top: 90px; width: 1600px; height: 900px; transform-origin: 50% 50%; }
  #winclip { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #0b0e11;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .09), 0 70px 140px -30px rgba(0, 0, 0, .85), 0 30px 60px -20px rgba(0, 0, 0, .6), 0 0 160px rgba(247, 147, 26, .10); }
  #winclip::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10); }
  #app { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0; background: #0b0e11; }

  #cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: 0; pointer-events: none; opacity: 0; transform-origin: 3px 2px; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .55)); z-index: 5; }
  .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(247, 147, 26, .95); background: rgba(247, 147, 26, .18); pointer-events: none; z-index: 4; opacity: 0; }

  /* ---- intro logo ---- */
  #intro { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  #intro svg { overflow: visible; }
  #intro .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(247, 147, 26, .55), rgba(247, 147, 26, .12) 40%, transparent 68%); filter: blur(20px); }
  #endglow { position: absolute; inset: 0; opacity: 0; background-image: var(--endglow); background-size: 100% 100%; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background-size: 100% 100%; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .028; background-size: 256px 256px; }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="view">
  <div id="bg">
    <div class="layer" id="layer-far">
      <div class="orb" style="left: 280px; top: 520px; width: 760px; height: 520px; background: rgba(247,147,26,.16)"></div>
      <div class="orb" style="left: 1280px; top: 120px; width: 620px; height: 480px; background: rgba(60,90,170,.14)"></div>
      <div class="orb" style="left: 900px; top: 900px; width: 700px; height: 420px; background: rgba(247,147,26,.12)"></div>
    </div>
    <div class="layer" id="layer-near"></div>
  </div>
  <div id="endglow"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="world">
    <div id="winwrap"><div id="winclip"><iframe id="app" src="app/index.html" scrolling="no"></iframe></div></div>
    <div class="ripples" id="ripples"></div>
    <svg id="cursor" viewBox="0 0 28 28" width="28" height="28"><path d="M3 2 L3 21 L8 16.5 L11.4 24 L14.6 22.6 L11.3 15.2 L18 15 Z" fill="#fff" stroke="#0b0e11" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div id="black"></div>
  <div id="intro">
    <div class="glow" id="intro-glow"></div>
    <svg id="intro-logo" viewBox="0 0 4 5" width="200" height="250" shape-rendering="crispEdges"></svg>
  </div>
</div>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</body>
</html>
